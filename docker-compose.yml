name: network

services:
  admin:
    build:
      context: ./Admin
      dockerfile: Dockerfile
    container_name: admin
    ports:
      - "8082:80"

  client:
    build:
      context: ./Client
      dockerfile: Dockerfile
    container_name: client
    ports:
      - "8081:80"

  api:
    build:
      context: ./Server/api
      dockerfile: Dockerfile
    container_name: api
    ports:
      - "8000:8000"
